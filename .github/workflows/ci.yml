name: Verify static GitHub Pages site

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      U1_BUNDLE_SECRET_CANARY: u1-private-value-must-not-reach-browser-output
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm run lint:platform
      - run: pnpm run verify:targets
      - run: pnpm run test:public
