name: Build and publish static website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm run lint:platform
      - run: pnpm run verify:targets
      # The published artifact is the static AFNET guide. Historical backend
      # tests remain available through `pnpm test` but do not govern Pages.
      - run: pnpm run test:public
      - name: Publish the static artifact to gh-pages
        env:
          DEPLOY_DIR: ${{ runner.temp }}/sekhon-marathon-pages
        run: |
          git fetch origin gh-pages
          git worktree add --detach "$DEPLOY_DIR" origin/gh-pages
          rsync --archive --delete --exclude=.git dist/pages/ "$DEPLOY_DIR/"
          touch "$DEPLOY_DIR/.nojekyll"
          git -C "$DEPLOY_DIR" config user.name "github-actions[bot]"
          git -C "$DEPLOY_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$DEPLOY_DIR" add --all
          if git -C "$DEPLOY_DIR" diff --cached --quiet; then
            echo "No public-site changes to publish."
            exit 0
          fi
          git -C "$DEPLOY_DIR" commit -m "Publish static AFNET guidance site"
          git -C "$DEPLOY_DIR" push origin HEAD:gh-pages
